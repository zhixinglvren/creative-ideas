<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>医保报销计算器 - Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#e3f2fd;color:#333;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:16px}
.header{text-align:center;padding:24px 0;background:linear-gradient(135deg,#1565c0,#0d47a1);color:#fff;border-radius:16px;margin-bottom:16px}
.header h1{font-size:22px;margin-bottom:4px}
.header .sub{font-size:12px;opacity:.85;margin-top:4px;line-height:1.6}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card h3{font-size:15px;margin-bottom:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:#666;margin-bottom:4px}
.field input,.field select{width:100%;padding:10px 12px;border:1px solid #e0e0e0;border-radius:8px;font-size:15px;outline:none}
.field input:focus,.field select:focus{border-color:#1565c0}
.row2{display:flex;gap:10px}
.row2 .field{flex:1}
.result{display:none;margin-top:16px}
.result.show{display:block;animation:fadeUp .4s}
.summary-card{background:linear-gradient(135deg,#e3f2fd,#bbdefb);border-radius:14px;padding:22px;text-align:center;margin-bottom:12px}
.summary-card .label{font-size:12px;color:#666}
.summary-card .big{font-size:32px;font-weight:800;color:#0d47a1;margin:4px 0}
.summary-card .sub{font-size:11px;color:#888}
.detail{background:#fff;border-radius:12px;padding:14px;margin-bottom:8px;font-size:13px}
.detail .d-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f5f5f5}
.detail .d-row:last-child{border:none}
.detail .d-row .v{font-weight:700;color:#1565c0}
.detail .d-row .self{color:#e65100}
.tip{font-size:12px;color:#666;background:#f5f5f5;border-radius:10px;padding:12px;line-height:1.8}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#1565c0,#0d47a1);color:#fff;margin-top:8px;transition:transform .2s}
.btn:active{transform:scale(.97)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.footer{text-align:center;padding:24px 0;font-size:11px;color:#bbb}
</style>
</head>
<body>
<div class="app">
<div class="header"><h1>💊 医保报销计算器</h1><div class="sub">住院花了3万，医保能报多少？<br>起付线、封顶线、报销比例一次算清</div></div>

<div class="card"><h3>📋 参保信息</h3>
<div class="row2">
<div class="field"><label>参保类型</label>
<select id="plan"><option value="worker">👔 职工医保</option><option value="resident">🏠 居民医保</option></select></div>
<div class="field"><label>医院等级</label>
<select id="level"><option value="l3">🏥 三级医院</option><option value="l2">🏢 二级医院</option><option value="l1">🏘 一级/社区</option></select></div>
</div>
<div class="row2">
<div class="field"><label>就诊类型</label>
<select id="type"><option value="outpatient">🏥 门诊</option><option value="inpatient" selected>🛏 住院</option></select></div>
<div class="field"><label>医疗总费用（元）</label><input id="cost" type="number" value="30000" min="100" step="100" onchange="calc()"></div>
</div></div>

<button class="btn" onclick="calc()">🧮 算报销</button>

<div class="result" id="result"></div>
<div class="footer">医保报销计算器 · Demo · 以当地医保政策为准，此为简化估算</div>
</div>

<script>
// 简化模型：起付线、封顶线、报销比例（按医院等级）
var worker={
outpatient:{l3:{threshold:1800,rate:0.6,cap:20000},l2:{threshold:1300,rate:0.7,cap:20000},l1:{threshold:650,rate:0.85,cap:20000}},
inpatient:{l3:{threshold:1300,rate:0.85,cap:300000},l2:{threshold:800,rate:0.9,cap:300000},l1:{threshold:650,rate:0.95,cap:300000}}
};
var resident={
outpatient:{l3:{threshold:500,rate:0.5,cap:2000},l2:{threshold:300,rate:0.55,cap:2000},l1:{threshold:0,rate:0.6,cap:2000}},
inpatient:{l3:{threshold:1000,rate:0.6,cap:150000},l2:{threshold:500,rate:0.7,cap:150000},l1:{threshold:200,rate:0.85,cap:150000}}
};

function calc(){
var plan=document.getElementById('plan').value;
var level=document.getElementById('level').value;
var type=document.getElementById('type').value;
var cost=parseFloat(document.getElementById('cost').value)||0;

if(cost<=0)return;

var rules=(plan==='worker'?worker:resident)[type][level];
// 简化：假设 85% 费用在医保目录内
var inDir=cost*0.85;
var outDir=cost*0.15;
var payable=Math.max(0,inDir-rules.threshold);
var reimburse=Math.min(payable*rules.rate,rules.cap);
var selfPay=cost-reimburse;
var rate=reimburse/cost*100;

var planName=plan==='worker'?'职工医保':'居民医保';
var typeName=type==='outpatient'?'门诊':'住院';
var levelName={l3:'三级医院',l2:'二级医院',l1:'一级/社区'}[level];

var h='';
h+='<div class="summary-card"><div class="label">💊 '+planName+' · '+typeName+' · '+levelName+'</div><div class="big">医保报销 ¥'+Math.round(reimburse).toLocaleString()+'</div><div class="sub">综合报销比例 '+rate.toFixed(1)+'% · 个人自付 ¥'+Math.round(selfPay).toLocaleString()+'</div></div>';

h+='<div class="detail">';
h+='<div class="d-row"><span>医疗总费用</span><span>¥'+cost.toLocaleString()+'</span></div>';
h+='<div class="d-row"><span>目录内费用（估算85%）</span><span>¥'+Math.round(inDir).toLocaleString()+'</span></div>';
h+='<div class="d-row"><span>目录外/自费项目</span><span class="self">¥'+Math.round(outDir).toLocaleString()+'</span></div>';
h+='<div class="d-row"><span>起付线（超过部分才报）</span><span>¥'+rules.threshold.toLocaleString()+'</span></div>';
h+='<div class="d-row"><span>报销比例</span><span class="v">'+(rules.rate*100)+'%</span></div>';
h+='<div class="d-row"><span>年度封顶线</span><span>¥'+rules.cap.toLocaleString()+'</span></div>';
h+='<div class="d-row" style="font-weight:700;border-top:1px solid #eee;margin-top:4px;padding-top:8px"><span>医保报销</span><span class="v" style="font-size:16px">¥'+Math.round(reimburse).toLocaleString()+'</span></div>';
h+='<div class="d-row"><span>个人自付</span><span class="self" style="font-weight:700">¥'+Math.round(selfPay).toLocaleString()+'</span></div>';
h+='</div>';

h+='<div class="tip">💡 <b>医保报销要点</b>：<br>• 三大目录：药品/诊疗/服务设施，目录内才报销，进口药/特需多为自费<br>• 起付线：年内累计超过才报（各地不同，此处为简化值）<br>• 封顶线：超出的走大病医保/医疗救助<br>• 异地就医：提前备案，报销比例可能降 10%<br>• 职工医保个人账户可支付门诊自付部分<br>• 二次报销：超过大病保险起付线可再报一次<br>• 商业补充险（惠民保）：几十元/年，可补目录外费用</div>';

document.getElementById('result').innerHTML=h;
document.getElementById('result').className='result show';
}
</script>
</body>
</html>
