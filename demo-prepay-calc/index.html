<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>提前还贷计算器 - Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#e8f5e9;color:#333;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:16px}
.header{text-align:center;padding:24px 0;background:linear-gradient(135deg,#2e7d32,#1b5e20);color:#fff;border-radius:16px;margin-bottom:16px}
.header h1{font-size:22px;margin-bottom:4px}
.header .sub{font-size:12px;opacity:.85;margin-top:4px;line-height:1.6}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card h3{font-size:15px;margin-bottom:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:#666;margin-bottom:4px}
.field input,.field select{width:100%;padding:10px 12px;border:1px solid #e0e0e0;border-radius:8px;font-size:15px;outline:none}
.field input:focus,.field select:focus{border-color:#2e7d32}
.row2{display:flex;gap:10px}
.row2 .field{flex:1}
.mode-tabs{display:flex;gap:6px;margin-bottom:14px}
.mode-tab{flex:1;padding:10px 8px;border-radius:10px;border:2px solid #e0e0e0;text-align:center;font-size:13px;cursor:pointer;transition:all .2s}
.mode-tab.sel{border-color:#2e7d32;background:#e8f5e9;font-weight:600;color:#2e7d32}
.result{display:none;margin-top:16px}
.result.show{display:block;animation:fadeUp .4s}
.save-card{background:linear-gradient(135deg,#e8f5e9,#c8e6c9);border-radius:14px;padding:24px;text-align:center;margin-bottom:12px}
.save-card .big{font-size:36px;font-weight:800;color:#1b5e20}
.save-card .label{font-size:12px;color:#666;margin-top:4px}
.compare{background:#fff;border-radius:12px;padding:16px;margin-bottom:8px}
.compare .c-title{font-weight:700;font-size:14px;margin-bottom:8px}
.compare .c-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid #f0f0f0}
.compare .c-row:last-child{border:none}
.compare .c-row .v{font-weight:600;color:#2e7d32}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#2e7d32,#1b5e20);color:#fff;margin-top:8px;transition:transform .2s}
.btn:active{transform:scale(.97)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.footer{text-align:center;padding:24px 0;font-size:11px;color:#bbb}
</style>
</head>
<body>
<div class="app">
<div class="header"><h1>🏠 提前还贷计算器</h1><div class="sub">手里有闲钱，提前还房贷到底省多少？<br>缩短年限还是减少月供？一算便知</div></div>

<div class="card"><h3>📋 贷款信息</h3>
<div class="row2">
<div class="field"><label>贷款总额（万元）</label><input id="loanAmt" type="number" value="200" min="10" onchange="calc()"></div>
<div class="field"><label>年利率（%）</label><input id="rate" type="number" value="3.5" min="1" max="6" step="0.05" onchange="calc()"></div>
</div>
<div class="row2">
<div class="field"><label>贷款年限（年）</label><input id="loanYears" type="number" value="30" min="1" max="30" onchange="calc()"></div>
<div class="field"><label>已还（年）</label><input id="paidYears" type="number" value="5" min="0" onchange="calc()"></div>
</div>
<div class="field"><label>提前还款金额（万元）</label><input id="prepayAmt" type="number" value="50" min="1" onchange="calc()"></div>
</div>

<div class="card"><h3>🔄 还款方式选择</h3>
<div class="mode-tabs">
<div class="mode-tab sel" id="tabA" onclick="selMode('A')">📉 缩短年限</div>
<div class="mode-tab" id="tabB" onclick="selMode('B')">💰 减少月供</div>
</div></div>

<button class="btn" onclick="calc()">🧮 计算节省利息</button>

<div class="result" id="result"></div>
<div class="footer">提前还贷计算器 · Demo · 仅供参考，以银行实际方案为准</div>
</div>

<script>
var mode='A';
function selMode(m){
mode=m;
document.getElementById('tabA').className=m==='A'?'mode-tab sel':'mode-tab';
document.getElementById('tabB').className=m==='B'?'mode-tab sel':'mode-tab';
calc();
}

function calc(){
var P=parseFloat(document.getElementById('loanAmt').value)*10000;
var r=parseFloat(document.getElementById('rate').value)/100/12;
var N=parseInt(document.getElementById('loanYears').value)*12;
var paid=parseInt(document.getElementById('paidYears').value)*12;
var prepay=parseFloat(document.getElementById('prepayAmt').value)*10000;

if(!P||!r||!N)return;
if(paid>=N)return;

// 等额本息月供
var M=P*r*Math.pow(1+r,N)/(Math.pow(1+r,N)-1);
// 已还后剩余本金
var remaining=P*Math.pow(1+r,N)-M*(Math.pow(1+r,paid)-1);
remaining=Math.max(0,remaining);
// 剩余期数
var remainN=N-paid;

// 原方案剩余利息
var origInterest=0;
var bal=remaining;
var monthlyRemain=M;
for(var i=0;i<remainN;i++){
origInterest+=bal*r;
bal=bal*(1+r)-monthlyRemain;
if(bal<0)bal=0;
}
origInterest=Math.max(0,origInterest);

// 提前还款后
var newP=remaining-prepay;
if(newP<0)newP=0;

var save=0,newMonthly=0,newYears=0;

if(mode==='A'){ // 缩短年限：月供不变
var remainM=M;
// 找新期数：等额本息反解
var nNew=0;
if(remainM>newP*r){
nNew=Math.log(remainM/(remainM-newP*r))/Math.log(1+r);
nNew=Math.ceil(nNew);
}else{nNew=1}
var newInterest=0;
var b=newP;
for(var i=0;i<nNew;i++){
newInterest+=b*r;
b=b*(1+r)-remainM;
if(b<0)b=0;
}
save=origInterest-newInterest;
newMonthly=remainM;
newYears=Math.ceil(nNew/12);
}else{ // 减少月供：年限不变
var newM=newP*r*Math.pow(1+r,remainN)/(Math.pow(1+r,remainN)-1);
var newInterest=0;
var b=newP;
for(var i=0;i<remainN;i++){
newInterest+=b*r;
b=b*(1+r)-newM;
if(b<0)b=0;
}
save=origInterest-newInterest;
newMonthly=newM;
newYears=Math.ceil(remainN/12);
}

var h='';
h+='<div class="save-card"><div class="label">💰 总共节省利息</div><div class="big">¥'+Math.round(save).toLocaleString()+'</div><div class="label">提前还 ¥'+(prepay/10000).toFixed(0)+' 万，共节省 '+Math.round(save/origInterest*100)+'% 的剩余利息</div></div>';

h+='<div class="compare"><div class="c-title">📊 还款方案对比</div>';
h+='<div class="c-row"><span>提前前月供</span><span class="v">¥'+Math.round(M).toLocaleString()+'</span></div>';
h+='<div class="c-row"><span>提前后月供</span><span class="v">¥'+Math.round(newMonthly).toLocaleString()+'</span></div>';
h+='<div class="c-row"><span>剩余还款期数</span><span class="v">'+(mode==='A'?newYears+' 年 ('+Math.ceil(nNew)+'期)':'仍为 '+Math.ceil(remainN/12)+' 年')+'</span></div>';
h+='<div class="c-row"><span>剩余总还款</span><span class="v">¥'+Math.round(newMonthly*(mode==='A'?nNew:remainN)).toLocaleString()+'</span></div>';
h+='</div>';

if(mode==='A'){
h+='<div style="font-size:12px;color:#666;background:#f5f5f5;border-radius:10px;padding:12px;line-height:1.7">💡 <b>缩短年限</b>：月供不变，还贷周期缩短，总利息节省最多（通常比减少月供多省 30-50% 利息），适合现金流稳定、想尽快"上岸"的人。</div>';
}else{
h+='<div style="font-size:12px;color:#666;background:#f5f5f5;border-radius:10px;padding:12px;line-height:1.7">💡 <b>减少月供</b>：还款年限不变，每月压力变小，节省利息较少，适合月供压力大、现金流紧张的人。</div>';
}
h+='<div style="font-size:11px;color:#999;margin-top:8px;line-height:1.6">⚠️ 提示：部分银行提前还款有违约金（通常为 1-3 个月利息，或 1% 还款金额），需扣除后对比实际节省。公积金贷款利率通常低于商贷，优先还商贷更划算。</div>';

document.getElementById('result').innerHTML=h;
document.getElementById('result').className='result show';
}
</script>
</body>
</html>
