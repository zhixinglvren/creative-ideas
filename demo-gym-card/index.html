<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>健身卡划算度计算器 - Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fce4ec;color:#333;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:16px}
.header{text-align:center;padding:24px 0;background:linear-gradient(135deg,#ad1457,#880e4f);color:#fff;border-radius:16px;margin-bottom:16px}
.header h1{font-size:22px;margin-bottom:4px}
.header .sub{font-size:12px;opacity:.85;margin-top:4px;line-height:1.6}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card h3{font-size:15px;margin-bottom:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:#666;margin-bottom:4px}
.field input,.field select{width:100%;padding:10px 12px;border:1px solid #e0e0e0;border-radius:8px;font-size:15px;outline:none}
.field input:focus,.field select:focus{border-color:#ad1457}
.row2{display:flex;gap:10px}
.row2 .field{flex:1}
.result{display:none;margin-top:16px}
.result.show{display:block;animation:fadeUp .4s}
.verdict-card{background:linear-gradient(135deg,#fce4ec,#f8bbd0);border-radius:14px;padding:24px;text-align:center;margin-bottom:12px}
.verdict-card .big{font-size:20px;font-weight:800;color:#880e4f;line-height:1.5}
.verdict-card .sub{font-size:12px;color:#888;margin-top:8px}
.compare{background:#fff;border-radius:12px;padding:16px;margin-bottom:8px}
.compare .c-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid #f5f5f5}
.compare .c-row:last-child{border:none}
.compare .c-row .v{font-weight:700;color:#ad1457}
.compare .c-row .warn{color:#e53935}
.compare .c-row .good{color:#2e7d32}
.tip{font-size:12px;color:#666;background:#f5f5f5;border-radius:10px;padding:12px;line-height:1.8}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#ad1457,#880e4f);color:#fff;margin-top:8px;transition:transform .2s}
.btn:active{transform:scale(.97)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.footer{text-align:center;padding:24px 0;font-size:11px;color:#bbb}
</style>
</head>
<body>
<div class="app">
<div class="header"><h1>💪 健身卡划算度计算器</h1><div class="sub">年卡几千块，你一年真能去几次？<br>算完再决定办不办</div></div>

<div class="card"><h3>💳 卡种价格</h3>
<div class="row2">
<div class="field"><label>年卡价格（元）</label><input id="yearCard" type="number" value="2500" min="100" onchange="calc()"></div>
<div class="field"><label>次卡/单次价（元）</label><input id="perVisit" type="number" value="35" min="5" onchange="calc()"></div>
</div>
<div class="field"><label>按次付费月费（如健身房无年卡，或考虑短期）</label><input id="monthlyFee" type="number" value="300" min="50" onchange="calc()"></div></div>

<div class="card"><h3>📅 你的实际使用</h3>
<div class="field"><label>预计每周去几次</label><input id="visits" type="number" value="2" min="0" max="14" step="0.5" onchange="calc()"></div>
<div class="field"><label>年卡实际使用月份（办卡后能坚持几个月？）</label><input id="activeMonths" type="number" value="6" min="1" max="12" onchange="calc()"></div></div>

<button class="btn" onclick="calc()">🧮 算算办不办</button>

<div class="result" id="result"></div>
<div class="footer">健身卡划算度计算器 · Demo · 对自己诚实，才不会被年卡套牢</div>
</div>

<script>
function calc(){
var yearCard=parseFloat(document.getElementById('yearCard').value)||0;
var perVisit=parseFloat(document.getElementById('perVisit').value)||0;
var monthlyFee=parseFloat(document.getElementById('monthlyFee').value)||0;
var weekly=parseFloat(document.getElementById('visits').value)||0;
var activeMonths=parseInt(document.getElementById('activeMonths').value)||12;

var yearlyVisits=weekly*52;
// 年卡实际单次成本（按实际活跃月份折算，假设活跃期内每周稳定去）
var activeVisits=weekly*4.33*activeMonths;
var actualCostPerVisit=activeVisits>0?yearCard/activeVisits:0;
// 如果全年坚持，年卡单次成本
var fullCostPerVisit=yearlyVisits>0?yearCard/yearlyVisits:0;
// 按次付费全年成本（如果每周都去）
var payAsGoCost=yearlyVisits*perVisit;
// 月度方案全年成本
var monthlyYearCost=monthlyFee*12;

// 判定
var verdict='';
var reason='';
if(weekly<=0){
verdict='别办！你大概率不会去';
reason='预计每周去 0 次——年卡就是给健身房做慈善。想运动先从楼下散步开始。';
}else if(actualCostPerVisit>perVisit){
verdict='💸 亏大了！别办年卡';
reason='按你诚实估计的活跃时间算，年卡每次实际成本 ¥'+actualCostPerVisit.toFixed(1)+'，比单次 ¥'+perVisit.toFixed(1)+' 还贵。你的年卡会变成"办卡即亏损"。';
}else if(actualCostPerVisit<perVisit*0.7){
verdict='✅ 可以办！你的频率撑得起';
reason='按活跃期折算，年卡每次仅 ¥'+actualCostPerVisit.toFixed(1)+'，比单次省 ¥'+(perVisit-actualCostPerVisit).toFixed(1)+'。前提是——你真的能坚持 '+activeMonths+' 个月。';
}else{
verdict='⚠️ 边缘情况，谨慎决定';
reason='年卡单次成本 ¥'+actualCostPerVisit.toFixed(1)+' 和单次价差不多。这种时候别买年卡，用次卡/月卡更灵活。';
}

var h='';
h+='<div class="verdict-card"><div class="big">'+verdict+'</div><div class="sub">'+reason+'</div></div>';

h+='<div class="compare"><div style="font-weight:700;font-size:14px;margin-bottom:8px">📊 成本对比</div>';
h+='<div class="c-row"><span>全年预计次数</span><span class="v">'+Math.round(yearlyVisits)+' 次</span></div>';
h+='<div class="c-row"><span>年卡（全年坚持）单次成本</span><span class="'+(fullCostPerVisit<perVisit?'good':'warn')+'">¥'+fullCostPerVisit.toFixed(1)+'</span></div>';
h+='<div class="c-row"><span>年卡（实际'+activeMonths+'个月）单次成本</span><span class="'+(actualCostPerVisit<perVisit?'good':'warn')+'">¥'+actualCostPerVisit.toFixed(1)+'</span></div>';
h+='<div class="c-row"><span>全部按次付费</span><span class="v">¥'+payAsGoCost.toLocaleString()+'/年</span></div>';
h+='<div class="c-row"><span>按月付费</span><span class="v">¥'+monthlyYearCost.toLocaleString()+'/年</span></div>';
h+='<div class="c-row" style="font-weight:700;border-top:1px solid #eee;margin-top:4px;padding-top:8px"><span>年卡直接花费</span><span class="v">¥'+yearCard.toLocaleString()+'</span></div>';
h+='</div>';

h+='<div class="tip">💡 <b>防套牢指南</b>：<br>• 办卡前先"试营业"——单次去 4 周，看能不能坚持<br>• 冲动办卡的黄金定律：年卡价格 ÷ 50 ≤ 你实际单次预算？<br>• 考虑"按次付费 + 偶尔月卡"组合，灵活不套牢<br>• 健身房跑路风险：优先选连锁/老店，一次性费用越高风险越大</div>';

document.getElementById('result').innerHTML=h;
document.getElementById('result').className='result show';
}
</script>
</body>
</html>
