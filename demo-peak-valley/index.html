<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>峰谷电省钱计算器 - Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff8e1;color:#333;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:16px}
.header{text-align:center;padding:24px 0;background:linear-gradient(135deg,#f9a825,#f57f17);color:#fff;border-radius:16px;margin-bottom:16px}
.header h1{font-size:22px;margin-bottom:4px}
.header .sub{font-size:12px;opacity:.85;margin-top:4px;line-height:1.6}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card h3{font-size:15px;margin-bottom:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:#666;margin-bottom:4px}
.field input,.field select{width:100%;padding:10px 12px;border:1px solid #e0e0e0;border-radius:8px;font-size:15px;outline:none}
.field input:focus,.field select:focus{border-color:#f9a825}
.app-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;background:#fafafa;border-radius:10px;padding:10px}
.app-row .ar-name{font-size:13px;font-weight:600;width:100px}
.app-row .ar-pow{width:80px}
.app-row .ar-h{width:70px}
.app-row .ar-switch{font-size:1.2rem;cursor:pointer;text-align:center;width:32px;border:none;background:none}
.app-row .ar-note{font-size:11px;color:#999;flex:1}
.result{display:none;margin-top:16px}
.result.show{display:block;animation:fadeUp .4s}
.save-card{background:linear-gradient(135deg,#fff8e1,#ffe082);border-radius:14px;padding:24px;text-align:center;margin-bottom:12px}
.save-card .big{font-size:40px;font-weight:800;color:#e65100}
.save-card .label{font-size:12px;color:#888;margin-top:4px}
.detail{background:#fff;border-radius:12px;padding:14px;margin-bottom:8px;font-size:13px;line-height:2}
.detail .row{display:flex;justify-content:space-between}
.detail .row .v{font-weight:700;color:#e65100}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#f9a825,#f57f17);color:#fff;margin-top:8px;transition:transform .2s}
.btn:active{transform:scale(.97)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.footer{text-align:center;padding:24px 0;font-size:11px;color:#bbb}
</style>
</head>
<body>
<div class="app">
<div class="header"><h1>⚡ 峰谷电省钱计算器</h1><div class="sub">洗衣机、热水器挪到晚上10点后用<br>一年能省多少电费？</div></div>

<div class="card"><h3>📍 电价方案</h3>
<div class="field"><label>地区</label>
<select id="region">
<option value="1">浙江（峰0.568 / 谷0.288）</option>
<option value="2">上海（峰0.617 / 谷0.307）</option>
<option value="3">北京（峰0.4883 / 谷0.2883）</option>
<option value="4">广东（峰0.686 / 谷0.336）</option>
</select></div>
<div class="field"><label>峰时段（小时数/天）</label><input id="peakH" type="number" value="14" min="1" max="23" onchange="calc()"></div></div>

<div class="card"><h3>🔌 常用家电（点击切换用峰/谷）</h3>
<div id="apps"></div></div>

<button class="btn" onclick="calc()">🧮 计算一年省多少</button>

<div class="result" id="result"></div>
<div class="footer">峰谷电省钱计算器 · Demo · 以家庭实际用电习惯为准</div>
</div>

<script>
var apps=[
{name:'洗衣机',pow:500,h:1,use:1.5},
{name:'热水器',pow:2000,h:1.5,use:0.8},
{name:'电动车充电',pow:3000,h:2,use:1.2},
{name:'洗碗机',pow:800,h:1,use:1.2},
{name:'空调',pow:1200,h:6,use:0.9},
{name:'电热水壶',pow:1500,h:0.2,use:1.8},
];

function renderApps(){
var h='';
for(var i=0;i<apps.length;i++){
var a=apps[i];
h+='<div class="app-row"><span class="ar-name">'+a.name+'</span><span class="ar-pow" style="color:#999;font-size:11px">'+a.pow+'W</span><span class="ar-h" style="color:#999;font-size:11px">'+a.h+'h/次</span><button class="ar-switch" id="sw'+i+'" onclick="toggle('+i+')">'+(a.use>=1?'🌙':'☀️')+'</button><span class="ar-note">'+(a.use>=1?'谷时用':'峰时用')+'</span></div>';
}
document.getElementById('apps').innerHTML=h;
}
function toggle(i){
apps[i].use=apps[i].use>=1?0.2:1.5;
renderApps();
calc();
}

function calc(){
var region=document.getElementById('region').value;
var peakH=parseInt(document.getElementById('peakH').value)||14;
var valleyH=24-peakH;

var rates={1:{p:0.568,v:0.288},2:{p:0.617,v:0.307},3:{p:0.4883,v:0.2883},4:{p:0.686,v:0.336}};
var r=rates[region];

var total=0;
for(var i=0;i<apps.length;i++){
var a=apps[i];
var monthly=a.pow/1000*a.h*30;
var before=a.use>=1?monthly*r.v:monthly*r.p;
var after=a.use>=1?monthly*r.p:monthly*r.v;
total+=(after-before);
}

var yearly=total*12;
var h='';
h+='<div class="save-card"><div class="label">💡 如果家电全挪到谷时用，一年能省</div><div class="big">¥'+Math.max(0,Math.round(yearly)).toLocaleString()+'</div><div class="label">平均每月省 ¥'+Math.max(0,Math.round(total)).toLocaleString()+'</div></div>';

h+='<div class="detail"><div class="row"><span>峰时段电价</span><span class="v">¥'+r.p+'/度</span></div><div class="row"><span>谷时段电价</span><span class="v">¥'+r.v+'/度</span></div><div class="row"><span>峰谷差价</span><span class="v">¥'+(r.p-r.v).toFixed(3)+'/度</span></div><div class="row"><span>峰时/谷时</span><span class="v">'+peakH+'h / '+valleyH+'h</span></div></div>';

h+='<div style="font-size:12px;color:#666;background:#f5f5f5;border-radius:10px;padding:12px;line-height:1.8">💡 <b>省电妙招</b>：<br>• 洗衣机设「预约洗涤」到 22:00 后启动<br>• 热水器用定时插座，睡前 1 小时加热<br>• 电动车尽量夜间充电（谷价不到峰价一半）<br>• 大功率电器（空调/地暖）错峰使用</div>';

document.getElementById('result').innerHTML=h;
document.getElementById('result').className='result show';
}

renderApps();
calc();
</script>
</body>
</html>
