<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>家电维修报价判断 - Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#e8f5e9;color:#333;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:16px}
.header{text-align:center;padding:24px 0;background:linear-gradient(135deg,#2e7d32,#1b5e20);color:#fff;border-radius:16px;margin-bottom:16px}
.header h1{font-size:22px;margin-bottom:4px}
.header .sub{font-size:12px;opacity:.85;margin-top:4px;line-height:1.6}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card h3{font-size:15px;margin-bottom:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:#666;margin-bottom:4px}
.field input,.field select{width:100%;padding:10px 12px;border:1px solid #e0e0e0;border-radius:8px;font-size:15px;outline:none}
.field input:focus,.field select:focus{border-color:#2e7d32}
.result{display:none;margin-top:16px}
.result.show{display:block;animation:fadeUp .4s}
.verdict{background:linear-gradient(135deg,#e8f5e9,#c8e6c9);border-radius:14px;padding:20px;text-align:center;margin-bottom:12px}
.verdict.fair{background:linear-gradient(135deg,#e8f5e9,#c8e6c9)}
.verdict.high{background:linear-gradient(135deg,#fff8e1,#ffecb3)}
.verdict.rip{background:linear-gradient(135deg,#ffebee,#ffcdd2)}
.verdict .big{font-size:24px;font-weight:800;line-height:1.4}
.verdict.fair .big{color:#1b5e20}
.verdict.high .big{color:#e65100}
.verdict.rip .big{color:#c62828}
.verdict .sub{font-size:12px;color:#555;margin-top:6px;line-height:1.6}
.ref{background:#fff;border-radius:12px;padding:14px;margin-bottom:8px;border-left:4px solid #2e7d32;font-size:13px;line-height:1.8}
.ref .r-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #f5f5f5}
.ref .r-row:last-child{border:none}
.ref .r-price{font-weight:700;color:#2e7d32}
.tip{font-size:12px;color:#666;background:#f5f5f5;border-radius:10px;padding:12px;line-height:1.8}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#2e7d32,#1b5e20);color:#fff;margin-top:8px;transition:transform .2s}
.btn:active{transform:scale(.97)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.footer{text-align:center;padding:24px 0;font-size:11px;color:#bbb}
</style>
</head>
<body>
<div class="app">
<div class="header"><h1>🔧 家电维修报价判断</h1><div class="sub">修空调报价 800 到底贵不贵？<br>先看看市场行情再决定</div></div>

<div class="card"><h3>🛠 维修情况</h3>
<div class="field"><label>家电类型</label>
<select id="appliance" onchange="renderFaults()">
<option value="ac">❄️ 空调</option>
<option value="fridge">🧊 冰箱</option>
<option value="washer">👕 洗衣机</option>
<option value="heater">🔥 热水器</option>
</select></div>
<div class="field"><label>故障现象</label>
<select id="fault"></select></div>
<div class="field"><label>师傅报价（元，含配件+人工）</label><input id="quote" type="number" value="800" min="0" onchange="calc()"></div>
</div>

<button class="btn" onclick="calc()">🔍 判断报价</button>

<div class="result" id="result"></div>
<div class="footer">家电维修报价判断 · Demo · 价格为市场参考区间，各地有差异</div>
</div>

<script>
var db={
ac:[
{name:'不制冷 / 加氟',low:150,high:350,note:'按压力表读数加氟，正常 150-350 元。警惕"加氟800"——除非系统大修或换管'},
{name:'深度清洗',low:80,high:180,note:'挂机 80-120，柜机 150-180。拆洗比喷喷清洗剂贵但彻底'},
{name:'电容 / 启动器更换',low:100,high:220,note:'配件成本 20-50 元，人工占大头。5 分钟能换完'},
{name:'主板 / 电脑板更换',low:400,high:900,note:'配件 200-600。要求看旧板，防止"假换板"'},
{name:'压缩机更换',low:600,high:1500,note:'大修项目。先确认是压缩机坏还是只是电容坏——经常被夸大'},
{name:'移机（拆+装）',low:200,high:450,note:'含高空作业费 50-150。管路延长另算'}
],
fridge:[
{name:'不制冷（缺氟）',low:200,high:450,note:'冰箱封闭系统正常不漏，加氟说明有漏点，只加氟不补漏会复发'},
{name:'压缩机更换',low:500,high:1200,note:'大修。老冰箱（8年以上）修不如换'},
{name:'温控器 / 传感器',low:100,high:220,note:'小配件，常见故障'},
{name:'门封条更换',low:80,high:180,note:'漏冷导致不停机、结冰，换封条即可'}
],
washer:[
{name:'不脱水 / 不转',low:80,high:260,note:'多为皮带老化（配件 20-40）、电机电容故障'},
{name:'排水故障',low:100,high:220,note:'排水泵堵塞或损坏，配件 50-120'},
{name:'主板 / 电脑板',low:250,high:600,note:'波轮 250-400，滚筒 400-600'},
{name:'滚筒轴承 / 三脚架',low:300,high:800,note:'拆机工作量大，滚筒常见大修'}
],
heater:[
{name:'燃气热水器打不着火',low:80,high:220,note:'多为点火针、电磁阀、水压膜片，配件便宜'},
{name:'清洗水垢',low:100,high:220,note:'水垢厚导致费气、水温不稳'},
{name:'加热棒 / 内胆更换',low:200,high:600,note:'电热水器项目。内胆漏水通常直接换新机更划算'},
{name:'电脑板 / 显示器',low:200,high:500,note:'配件价格差异大，要求报配件型号'}
]};

function renderFaults(){
var app=document.getElementById('appliance').value;
var list=db[app];
var sel=document.getElementById('fault');
sel.innerHTML='';
for(var i=0;i<list.length;i++){
sel.innerHTML+='<option value="'+i+'">'+list[i].name+'</option>';
}
calc();
}

function calc(){
var app=document.getElementById('appliance').value;
var idx=parseInt(document.getElementById('fault').value)||0;
var item=db[app]?db[app][idx]:null;
var quote=parseFloat(document.getElementById('quote').value)||0;
if(!item)return;

var ratio=quote/item.high;
var cls,verdict,desc;
if(quote<=item.high*1.05){
cls='fair';verdict='✅ 报价合理';
desc='在正常市场区间内，可以直接修。';
}else if(ratio<=1.5){
cls='high';verdict='⚠️ 偏高，建议再比一家';
desc='超出区间上限约 '+Math.round((ratio-1)*100)+'%，属于常见"看人报价"，值得砍价或换一家。';
}else{
cls='rip';verdict='🚨 明显过高，大概率被宰';
desc='超出市场高位 '+(ratio-1).toFixed(1)+' 倍。除非含特殊配件，否则建议直接换师傅。';
}

var h='';
h+='<div class="verdict '+cls+'"><div class="big">'+verdict+'</div><div class="sub">报价 ¥'+quote+' · 市场参考 ¥'+item.low+'-'+item.high+'<br>'+desc+'</div></div>';

h+='<div class="ref"><div class="r-row"><span><b>'+item.name+'</b></span><span class="r-price">¥'+item.low+'-'+item.high+'</span></div>';
h+='<div style="font-size:12px;color:#666;margin-top:6px;line-height:1.7">💡 '+item.note+'</div></div>';

h+='<div class="ref" style="border-left-color:#3949ab"><b>同类项目参考</b>';
for(var i=0;i<db[app].length;i++){
var d2=db[app][i];
if(d2.name===item.name)continue;
h+='<div class="r-row"><span>'+d2.name+'</span><span class="r-price">¥'+d2.low+'-'+d2.high+'</span></div>';
}
h+='</div>';

h+='<div class="tip"><b>维修避坑五条</b>：<br>• <b>先问上门费</b>：多数 30-80 元，维修后应抵扣；有的师傅靠上门费赚钱，报个天价你不修他也收钱<br>• <b>要求看换下的旧件</b>：防止"假换配件"（说换了主板，其实只是复位）<br>• <b>"加氟"是最大套路</b>：空调不漏就不缺氟，反复加氟说明有漏点没修<br>• <b>报价拆开看</b>：配件费 + 人工费分别报，一串总价往往含水分<br>• <b>对比平台价</b>：京东服务/苏宁帮客/本地连锁都有明码标价，可作为砍价参考<br>• <b>8 年以上老家电</b>：维修超过新机价 1/3 就别修了，能耗和故障率都不划算</div>';

document.getElementById('result').innerHTML=h;
document.getElementById('result').className='result show';
}
renderFaults();
</script>
</body>
</html>
