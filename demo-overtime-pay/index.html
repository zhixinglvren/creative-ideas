<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>加班费计算器 - Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#e8eaf6;color:#333;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:16px}
.header{text-align:center;padding:24px 0;background:linear-gradient(135deg,#3949ab,#1a237e);color:#fff;border-radius:16px;margin-bottom:16px}
.header h1{font-size:22px;margin-bottom:4px}
.header .sub{font-size:12px;opacity:.85;margin-top:4px;line-height:1.6}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card h3{font-size:15px;margin-bottom:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:#666;margin-bottom:4px}
.field input{width:100%;padding:10px 12px;border:1px solid #e0e0e0;border-radius:8px;font-size:15px;outline:none}
.field input:focus{border-color:#3949ab}
.row2{display:flex;gap:10px}
.row2 .field{flex:1}
.result{display:none;margin-top:16px}
.result.show{display:block;animation:fadeUp .4s}
.total-card{background:linear-gradient(135deg,#e8eaf6,#c5cae9);border-radius:14px;padding:24px;text-align:center;margin-bottom:12px}
.total-card .label{font-size:12px;color:#888}
.total-card .big{font-size:40px;font-weight:800;color:#1a237e;margin:4px 0}
.total-card .sub{font-size:11px;color:#888}
.detail{background:#fff;border-radius:12px;padding:14px;margin-bottom:8px;font-size:13px}
.detail .d-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f5f5f5}
.detail .d-row:last-child{border:none}
.detail .d-row .v{font-weight:700;color:#3949ab}
.tip{font-size:12px;color:#666;background:#f5f5f5;border-radius:10px;padding:12px;line-height:1.8}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#3949ab,#1a237e);color:#fff;margin-top:8px;transition:transform .2s}
.btn:active{transform:scale(.97)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.footer{text-align:center;padding:24px 0;font-size:11px;color:#bbb}
</style>
</head>
<body>
<div class="app">
<div class="header"><h1>⏰ 加班费计算器</h1><div class="sub">月薪2万，周末加班8小时该拿多少？<br>劳动法标准：1.5倍/2倍/3倍</div></div>

<div class="card"><h3>💰 工资信息</h3>
<div class="field"><label>月薪（税前，元）</label><input id="salary" type="number" value="15000" min="2000" onchange="calc()"></div>
<div class="field"><label>月计薪天数（默认21.75）</label><input id="days" type="number" value="21.75" min="1" step="0.01" onchange="calc()"></div></div>

<div class="card"><h3>⏱ 本月加班时长（小时）</h3>
<div class="field"><label>🏢 工作日加班（1.5倍）</label><input id="workday" type="number" value="10" min="0" onchange="calc()"></div>
<div class="field"><label>📅 休息日加班（2倍）</label><input id="restday" type="number" value="16" min="0" onchange="calc()"></div>
<div class="field"><label>🎉 法定节假日加班（3倍）</label><input id="holiday" type="number" value="0" min="0" onchange="calc()"></div></div>

<button class="btn" onclick="calc()">🧮 算加班费</button>

<div class="result" id="result"></div>
<div class="footer">加班费计算器 · Demo · 依据《劳动法》第44条，仅供参考</div>
</div>

<script>
function calc(){
var salary=parseFloat(document.getElementById('salary').value)||0;
var days=parseFloat(document.getElementById('days').value)||21.75;
var wd=parseFloat(document.getElementById('workday').value)||0;
var rd=parseFloat(document.getElementById('restday').value)||0;
var hd=parseFloat(document.getElementById('holiday').value)||0;

// 时薪 = 月薪 ÷ 21.75 ÷ 8
var hourly=salary/days/8;

var wdPay=hourly*1.5*wd;
var rdPay=hourly*2*rd;
var hdPay=hourly*3*hd;
var total=wdPay+rdPay+hdPay;

var h='';
h+='<div class="total-card"><div class="label">💰 本月应得加班费</div><div class="big">¥'+Math.round(total).toLocaleString()+'</div><div class="sub">时薪 ¥'+hourly.toFixed(1)+' × '+(wd+rd+hd)+' 小时</div></div>';

h+='<div class="detail">';
if(wd>0)h+='<div class="d-row"><span>🏢 工作日加班 '+wd+'h × 1.5倍</span><span class="v">¥'+Math.round(wdPay).toLocaleString()+'</span></div>';
if(rd>0)h+='<div class="d-row"><span>📅 休息日加班 '+rd+'h × 2倍</span><span class="v">¥'+Math.round(rdPay).toLocaleString()+'</span></div>';
if(hd>0)h+='<div class="d-row"><span>🎉 法定节假日加班 '+hd+'h × 3倍</span><span class="v">¥'+Math.round(hdPay).toLocaleString()+'</span></div>';
if(wd+rd+hd===0)h+='<div class="d-row"><span>本月无加班</span><span class="v">¥0</span></div>';
h+='</div>';

h+='<div class="tip">💡 <b>法律要点</b>：<br>• 依据《劳动法》第44条：工作日加班 ≥150%，休息日加班 ≥200%且优先安排补休，法定节假日加班 ≥300%<br>• 时薪计算基数 = 月工资 ÷ 21.75天 ÷ 8小时（月计薪天数）<br>• 公司用"调休"冲抵法定节假日加班费属违法<br>• 加班费基数有争议时，按劳动合同约定工资计算<br>• 维权渠道：劳动仲裁（免费）或拨打 12333</div>';

document.getElementById('result').innerHTML=h;
document.getElementById('result').className='result show';
}
</script>
</body>
</html>
