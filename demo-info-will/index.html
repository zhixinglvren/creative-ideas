<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>信息遗嘱 - Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:16px}
.header{text-align:center;padding:24px 0;background:linear-gradient(135deg,#4a148c,#311b92);color:#fff;border-radius:16px;margin-bottom:16px}
.header h1{font-size:22px;margin-bottom:4px}
.header .sub{font-size:12px;opacity:.85}
.intro{font-size:13px;color:#9e9e9e;text-align:center;margin-bottom:16px;line-height:1.8;padding:0 10px}
.category{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:16px;margin-bottom:12px}
.category .cat-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;cursor:pointer}
.category .cat-icon{font-size:28px}
.category .cat-name{font-weight:700;font-size:15px}
.category .cat-count{font-size:11px;color:#888;margin-left:auto}
.category .cat-body{display:none;padding-top:8px}
.category.open .cat-body{display:block}
.item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px}
.item:last-child{border-bottom:none}
.item .i-left{display:flex;align-items:center;gap:8px}
.item .i-icon{font-size:16px}
.item .i-status{font-size:11px;padding:2px 8px;border-radius:8px;font-weight:600}
.status-ready{background:rgba(76,175,80,.2);color:#81c784}
.status-warn{background:rgba(255,152,0,.2);color:#ffb74d}
.status-miss{background:rgba(244,67,54,.2);color:#ef9a9a}
.protection{background:rgba(255,255,255,0.05);border:1px solid rgba(118,75,162,.3);border-radius:12px;padding:14px;margin-top:16px;font-size:12px;line-height:1.8}
.protection h4{color:#ce93d8;margin-bottom:6px}
.save-btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#7c4dff,#651fff);color:#fff;margin-top:16px;transition:transform .2s}
.save-btn:active{transform:scale(.97)}
.footer{text-align:center;padding:24px 0;font-size:11px;color:#666}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#4caf50;color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;z-index:10}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
<div class="header"><h1>📜 信息遗嘱</h1><div class="sub">数字身后事整理师 · 让重要信息不随你消失</div></div>
<div class="intro">你的数字资产比你想象的更多——账号、密码、文件、订阅……万一有意外，家人能否找到这些？整理一份信息遗嘱，守护你的数字遗产。</div>

<div id="categories"></div>

<div class="protection">
<h4>🔒 安全设计原则</h4>
• 数据仅存储在本地浏览器中，不上传服务器<br>
• 可设置「死亡开关」——指定时间内不登录则自动解密发送给指定联系人<br>
• 支持加密导出，密码由你设定<br>
• 正式版支持律师/遗嘱执行人双重授权解锁
</div>

<button class="save-btn" onclick="showToast()">💾 导出加密备份（Demo）</button>
<div class="toast" id="toast">✅ 备份已生成（Demo）</div>

<div class="footer">信息遗嘱 · Demo · 仅供演示</div>
</div>

<script>
var categories=[
{
icon:'💳',name:'金融账户',items:[
{icon:'🏦',name:'银行主账户',desc:'工资卡 · 招商银行',status:'ready'},
{icon:'📈',name:'证券账户',desc:'华泰证券 · 持仓中',status:'ready'},
{icon:'🪙',name:'数字货币钱包',desc:'助记词已备份',status:'warn'},
{icon:'💎',name:'支付宝/微信支付',desc:'需登记关联手机号',status:'miss'}
]
},
{
icon:'🔑',name:'账号密码',items:[
{icon:'📧',name:'主邮箱',desc:'Gmail · 2FA 已开启',status:'ready'},
{icon:'🐙',name:'GitHub',desc:'需登记 Recovery Code',status:'warn'},
{icon:'☁️',name:'云存储',desc:'iCloud + 百度网盘',status:'ready'},
{icon:'📱',name:'社交媒体',desc:'微信/微博/知乎',status:'miss'}
]
},
{
icon:'📄',name:'重要文件',items:[
{icon:'📝',name:'遗嘱原件',desc:'PDF 存放路径需登记',status:'miss'},
{icon:'🏠',name:'房产证',desc:'扫描件已备份',status:'ready'},
{icon:'📋',name:'保险合同',desc:'需整理保单号',status:'warn'},
{icon:'💼',name:'投资协议',desc:'合伙人协议需标注',status:'miss'}
]
},
{
icon:'📬',name:'订阅与定期支出',items:[
{icon:'🎵',name:'音乐/视频会员',desc:'自动续费 3 项',status:'ready'},
{icon:'☁️',name:'云服务',desc:'阿里云 按量付费',status:'warn'},
{icon:'🏠',name:'房贷/房租',desc:'每月自动扣款',status:'ready'},
{icon:'📱',name:'手机套餐',desc:'需登记运营商',status:'miss'}
]
}
];

var h='';
for(var i=0;i<categories.length;i++){
var c=categories[i];
var ready=0,warn=0,miss=0;
for(var j=0;j<c.items.length;j++){
if(c.items[j].status==='ready')ready++;
else if(c.items[j].status==='warn')warn++;
else miss++;
}
h+='<div class="category" onclick="toggle(this)">';
h+='<div class="cat-header"><div class="cat-icon">'+c.icon+'</div>';
h+='<div class="cat-name">'+c.name+'</div>';
h+='<div class="cat-count">'+ready+'/'+c.items.length+' 已整理</div></div>';
h+='<div class="cat-body">';
for(var j=0;j<c.items.length;j++){
var it=c.items[j];
var cls=it.status==='ready'?'status-ready':it.status==='warn'?'status-warn':'status-miss';
var txt=it.status==='ready'?'已整理':it.status==='warn'?'需更新':'未登记';
h+='<div class="item"><div class="i-left"><span class="i-icon">'+it.icon+'</span><span>'+it.name+'</span></div>';
h+='<div><span style="font-size:11px;color:#888;margin-right:6px">'+it.desc+'</span>';
h+='<span class="i-status '+cls+'">'+txt+'</span></div></div>';
}
h+='</div></div>';
}
document.getElementById('categories').innerHTML=h;

function toggle(el){
el.classList.toggle('open');
}

function showToast(){
var t=document.getElementById('toast');
t.classList.add('show');
setTimeout(function(){t.classList.remove('show');},2000);
}
</script>
</body>
</html>
